<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" role="img" aria-label="Remand">
  <title>Remand · Balanza recalculada</title>
  <!-- Viga inclinada: el fallo cambió de lado tras el recálculo. -->
  <path d="M11 24 L53 16" stroke="currentColor" stroke-width="4" stroke-linecap="square"/>
  <!-- Fiel y base. -->
  <path d="M32 20 V50" stroke="currentColor" stroke-width="4" stroke-linecap="square"/>
  <path d="M20 54 H44" stroke="currentColor" stroke-width="4" stroke-linecap="square"/>
  <!-- Platillo del colateral: liviano, apenas una línea. -->
  <path d="M5 32 H23" stroke="currentColor" stroke-width="4" stroke-linecap="square"/>
  <path d="M11 24 V32" stroke="currentColor" stroke-width="4" stroke-linecap="square"/>
  <!-- Platillo de la evidencia: un bloque con masa, es lo que inclina la viga. -->
  <path d="M53 16 V24" stroke="currentColor" stroke-width="4" stroke-linecap="square"/>
  <rect x="43" y="24" width="20" height="14" stroke="currentColor" stroke-width="4"/>
</svg>
